; DallyControl remote-control repeater. Mode II only: both sides present the same session id, which the
; console mints per session (128-bit, random). Mode I (a viewer naming any host to dial) stays off.
[general]
viewerport = 5900
serverport = 5500
ownipaddress = 0.0.0.0
maxsessions = 200
runasuser = uvncrep
allowedmodes = 2
logginglevel = 2

[mode1]
allowedmode1serverport = 0
requirelistedserver = 1

[mode2]
requirelistedid = 0

[eventinterface]
useeventinterface = no
